services:

  spark-events-init:
    image: spark:3.5.8
    container_name: atlas-spark-events-init

    user: "0:0"

    entrypoint:
      - /bin/sh
      - -c

    command:
      - >
        chown -R spark:spark /opt/spark-events &&
        chmod -R 775 /opt/spark-events

    volumes:
      - spark-events:/opt/spark-events

    restart: "no"
  

  spark-master:
    build:
      context: ./docker/spark
      dockerfile: Dockerfile

    image: atlas-spark:3.5.8
    container_name: atlas-spark-master

    command:
      - /opt/spark/bin/spark-class
      - org.apache.spark.deploy.master.Master

    environment:
      SPARK_MASTER_HOST: spark-master
      SPARK_MASTER_PORT: 7077
      SPARK_MASTER_WEBUI_PORT: 8080

    ports:
      - "8080:8080"
      - "7077:7077"

    volumes:
      - spark-events:/opt/spark-events
      - ./jobs:/opt/spark/jobs
    depends_on: 
      spark-events-init:
        condition: service_completed_successfully  

    restart: unless-stopped

    networks:
      - atlas-network

  spark-worker:
    build:
      context: ./docker/spark
      dockerfile: Dockerfile

    image: atlas-spark:3.5.8
    container_name: atlas-spark-worker

    command:
      - /opt/spark/bin/spark-class
      - org.apache.spark.deploy.worker.Worker
      - spark://spark-master:7077

    environment:
      SPARK_WORKER_CORES: 2
      SPARK_WORKER_MEMORY: 2g
      SPARK_WORKER_WEBUI_PORT: 8081

    ports:
      - "8081:8081"

    volumes:
      - spark-events:/opt/spark-events
      - ./jobs:/opt/spark/jobs

    depends_on:
      spark-events-init:
        condition: service_completed_successfully
      spark-master:
        condition: service_started

    restart: unless-stopped

    networks:
      - atlas-network

  spark-history-server:
    build:
      context: ./docker/spark
      dockerfile: Dockerfile
    image: atlas-spark:3.5.8

    container_name: atlas-spark-history-server

    command:
      - /opt/spark/bin/spark-class
      - org.apache.spark.deploy.history.HistoryServer

    environment:
      SPARK_HISTORY_OPTS: >-
        -Dspark.history.fs.logDirectory=file:/opt/spark-events
        -Dspark.history.ui.port=18080

    ports:
      - "18080:18080"

    volumes:
      - spark-events:/opt/spark-events

    depends_on:
      spark-events-init:
        condition: service_completed_successfully
      spark-master:
        condition: service_started

    restart: unless-stopped

    networks:
      - atlas-network

  postgres:
    image: postgres:16
    container_name: atlas-spark-postgres

    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}

    ports:
      - "${POSTGRES_PORT}:5432"

    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./sql/ddl:/docker-entrypoint-initdb.d

    restart: unless-stopped

    networks:
      - atlas-network

networks:
  atlas-network:
    driver: bridge

volumes:
  postgres-data:
  spark-events: